<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Thief — a lantern-garden stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ember Thief: steal 3 lanterns from the night garden and slip out the gate unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script>
  // Report any script error into the title so a headless check can see it.
  window.addEventListener('error', (e) => { document.title = 'JS-ERROR: ' + e.message; });
</script>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
